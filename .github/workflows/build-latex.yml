name: Build LaTeX PDFs

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.pdf'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile all LaTeX roots
        shell: bash
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/xu-cheng/texlive-full:latest \
            sh tools/build.sh

      - name: Commit PDFs beside TeX files
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          while IFS= read -r -d '' pdf; do
            git add -- "$pdf"
          done < <(find Lembar_Kerja Materi -type f -name '*.pdf' -print0)

          if git diff --cached --quiet; then
            echo "PDF tidak berubah."
            exit 0
          fi

          git commit -m "Build PDFs [skip ci]"
          git pull --rebase origin main
          git push origin main
